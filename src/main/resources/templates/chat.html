<body>
<div class="card shadow-sm rounded-3 w-100 mx-3 chat-card">
    <div class="card-header bg-secondary text-white text-center d-flex justify-content-center align-items-center chat-header">
        <h1 class="mb-0 chat-title">💬 Real-Time Chat Application</h1>
    </div>

    <div class="card-body d-flex flex-column p-3 chat-body">
        <div id="chat" class="flex-grow-1 mb-3 px-2 py-1 border rounded bg-white">
            <!-- Messages will appear here -->
        </div>

        <input type="text" id="senderInput" class="form-control mb-3" placeholder="👤 Your name">

        <div class="input-group">
            <input type="text" id="messageInput" class="form-control" placeholder="✍️ Type a message...">
            <button id="sendMessage" class="btn btn-secondary">Send</button>
        </div>
    </div>
</div>
</body>


<script>
    function setConnected(connected){
        document.getElementById('sendMessage').disabled = !connected;
    }

    function connect(){
        var socket = new SockJS('/chat');
        stompClient = Stomp.over(socket);
        stompClient.connect({}, function (frame) {
            setConnected(true);
            stompClient.subscribe('/topic/messages', function (message){
                showMessage(JSON.parse(message.body));
            });
        });
    }

    function showMessage(message) {
        var chat = document.getElementById('chat');
        var messageElement = document.createElement('div');
        messageElement.textContent = message.sender + ' : ' + message.content;
        messageElement.class = "border-bottom mb-1";
        chat.appendChild(messageElement)
        chat.scrollTop = chat.scrollHeight;
    }

    function sendMessage() {
        var sender = document.getElementById('senderInput').value;
        var content = document.getElementById('messageInput').value;
        var chatMessage = {
            sender : sender,
            content : content
        }
        stompClient.send("/app/sendMessage", {}, JSON.stringify(chatMessage));
        document.getElementById('messageInput').value = '';
    }

    document.getElementById('sendMessage').onclick = sendMessage;
    window.onload = connect;
</script>
