<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Real-Time Chat Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
          crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.1/stomp.min.js"></script>
    <link rel="stylesheet" href="/css/style.css">


</head>

<body>
<div class="card-body d-flex flex-column p-3 chat-body">

    <!-- Room selector -->
    <div class="input-group mb-1">
        <span class="input-group-text"><i class="fa fa-door-open"></i></span>
        <select id="roomSelect" class="form-select"></select>
    </div>

    <!-- Messages appear here -->
    <div id="chat" class="flex-grow-1 mb-1 px-2 py-1 border rounded bg-white"></div>

    <p id="typingIndicator" class="mb-1" style="font-style: italic; color: gray; min-height: 1.5em;"></p>

    <!-- Name field -->
    <div id="nameGroup" class="input-group mb-1">
        <span class="input-group-text"><i class="fa fa-user"></i></span>
        <input type="text" id="senderInput" class="form-control" placeholder="Your name">
    </div>

    <!-- Message field -->
    <div id="messageGroup" class="input-group">
        <span class="input-group-text"><i class="fa-solid fa-pen"></i></span>
        <input type="text" id="messageInput" class="form-control" placeholder="Type a message...">
        <button id="sendMessage" class="btn btn-secondary">Send</button>
    </div>

</div>
</body>

<script src="/js/script.js"></script>
</html>
